name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'homebrew/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'homebrew/**'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Linux GPUI & SQLCipher system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libasound2-dev

      - name: Configure Windows OpenSSL for SQLCipher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @("C:\Program Files\OpenSSL-Win64", "C:\Program Files\OpenSSL")
          $root = $candidates | Where-Object { Test-Path "$_\include\openssl\evp.h" } | Select-Object -First 1
          if (-not $root) {
            choco install openssl -y --no-progress
            $root = $candidates | Where-Object { Test-Path "$_\include\openssl\evp.h" } | Select-Object -First 1
          }
          if (-not $root) {
            throw "OpenSSL headers not found after installation"
          }
          $lib = Get-ChildItem "$root\lib" -Filter "libcrypto.lib" -Recurse |
            Sort-Object { $_.FullName -notmatch 'x64\\MD' } |
            Select-Object -First 1
          if (-not $lib) {
            throw "Could not locate libcrypto.lib under $root\lib"
          }
          "OPENSSL_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$root\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$($lib.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path "$root\bin") {
            "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release -p life-cli -p life-gpui

      - name: Run CLI and MCP integration suites
        if: runner.os != 'Windows'
        env:
          LIFE_CLI: ${{ github.workspace }}/target/release/life
        run: |
          python3 qa/full_e2e.py
          python3 qa/figcraft_parity_e2e.py
          python3 qa/v9_extensions_e2e.py
          python3 qa/v11_reminders_habits_e2e.py
          python3 qa/parity_v15_e2e.py
          python3 qa/release_e2e.py
          python3 qa/encryption_e2e.py

      - name: Package & upload artifacts (macOS)
        if: runner.os == 'macOS'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          ./scripts/release.sh build
          ./scripts/release.sh dmg
          codesign --verify --strict --deep "dist/Life Manager.app"
          ./dist/life --json stats > /dev/null

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/life-gpui dist/life-gpui
          cp target/release/life dist/life
          ./dist/life --json stats > /dev/null

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/life-gpui.exe dist/life-gpui.exe
          Copy-Item target/release/life.exe dist/life.exe
          if ($env:OPENSSL_DIR -and (Test-Path "$env:OPENSSL_DIR\bin")) {
            Copy-Item "$env:OPENSSL_DIR\bin\libcrypto-*.dll" dist/ -ErrorAction SilentlyContinue
          }
          ./dist/life.exe --json stats | Out-Null

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: life-manager-${{ matrix.os }}
          retention-days: 3
          path: |
            dist/life
            dist/life.exe
            dist/life-gpui
            dist/life-gpui.exe
            dist/*.dll
            dist/LifeManager.dmg
          if-no-files-found: ignore

  design:
    name: FigCraft design validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install pillow
      - name: Validate design master and previews
        run: python3 design/scripts/validate_design.py
