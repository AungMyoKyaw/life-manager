[workspace]
members = ["crates/life-core", "crates/life-cli", "crates/life-gpui"]
resolver = "2"

# Optimize UI, text shaping, layout, and SQLCipher dependencies even in `cargo run` dev builds
# so GPUI scrolling and text rendering run at native 120fps without release build wait times.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
